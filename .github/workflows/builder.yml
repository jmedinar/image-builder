name: Build images and push them into Docker Hub

on:
    workflow_dispatch:
    push:
        branches:
            - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker HUB
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the image and push it
        run: |
          docker build -t docker.io/${{ secrets.DOCKER_USERNAME }}/action:v1 .
          docker push docker.io/${{ secrets.DOCKER_USERNAME }}/action:v1
